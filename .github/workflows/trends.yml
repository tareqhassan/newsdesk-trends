name: Export Google Trends

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trends-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

   - name: Export US trends
     id: export
     env:
       TRENDS_GEO: "US"
       TRENDS_HOURS: "168"
       TRENDS_MIN_ROWS: "100"
     run: python export_trends.py

   - name: Export Bangladesh trends
     id: export_bd
     if: ${{ !cancelled() }}
     env:
       TRENDS_GEO: "BD"
       TRENDS_HOURS: "168"
       TRENDS_MIN_ROWS: "1"
     run: python export_trends.py
     

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
                     git commit -m "Trends export $(date -u +%Y-%m-%d) (US: ${{ steps.export.outcome }}, BD: ${{ steps.export_bd.outcome }})"
            git push
          fi

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: debug-screenshots
          path: debug/
          retention-days: 7
